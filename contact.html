<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h1>Contact Me</h1>
            <p>Feel free to get in touch for any inquiries, collaborations, or questions.</p>
        </section>
        <section class="content">
            <h2>Contact Information</h2>
            <div class="contact-details">
                <p><strong>Email:</strong> youremail@example.com</p>
                <p><strong>Phone:</strong> +1 (555) 123-4567</p>
                <p><strong>Location:</strong> Your City, Your Country</p>
            </div>
        </section>
        <section class="contact-form">
            <h2>Send a Message</h2>
            <form action="#" method="post">
                <label for="name">Azmeer</label>
                <input type="text" id="name" name="name" required>
                
                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" required>
                
                <label for="message">Your Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
                
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Your Name | Designed with ❤️</p>
    </footer>
</body>
</html>
